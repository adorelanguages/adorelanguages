<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Любимые посты — Обожаю Языки</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Любимые посты блога «Обожаю Языки»: найди любимый пост через поиск и проголосуй за него на его странице.">
<link rel="canonical" href="https://adorelanguages.com/golosovania/hitlist/">
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<style>
  @font-face { font-family: 'Factora'; src: url('/FACTORA-REGULAR.OTF'); font-weight: normal; }
  @font-face { font-family: 'Factora'; src: url('/FACTORA-BOLD.OTF'); font-weight: bold; }

  * { box-sizing: border-box; }

  body {
    font-family: 'Factora', Georgia, serif;
    background: #ffffff;
    color: rgb(45, 44, 91);
    padding: 40px 20px 80px;
    margin: 0;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

  .home-button {
    font-family: 'Factora', Georgia, serif;
    font-size: 1em;
    color: #fff;
    background: rgb(45, 44, 91);
    padding: 14px 10px;
    border-radius: 18px;
    text-decoration: none;
    display: inline-block;
    width: 130px;
    box-sizing: border-box;
    text-align: center;
    line-height: 1.3;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .home-button .arrow { margin-right: 4px; }

  h1 {
    font-size: 1.8em;
    margin: 0;
    text-align: center;
    flex: 1;
    padding: 0 12px;
  }

  .thumb-link {
    display: block;
    cursor: pointer;
    flex-shrink: 0;
  }
  .thumb {
    width: 96px;
    height: 96px;
    object-fit: cover;
    border-radius: 14px;
    display: block;
    box-shadow: 0 2px 8px rgba(45,44,91,0.25);
    transition: transform 0.15s ease;
  }
  .thumb-link:hover .thumb {
    transform: scale(1.03);
  }

  .lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20,19,40,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 999;
    cursor: pointer;
  }
  .lightbox-overlay.visible {
    display: flex;
  }
  .lightbox-overlay img {
    max-width: 92vw;
    max-height: 90vh;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  p.lead {
    font-size: 1.05em;
    line-height: 1.5;
    margin: 0 0 8px;
  }

  .search-box {
    background: rgb(244,244,255);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 8px;
  }

  .search-box h2 {
    font-size: 1.1em;
    margin: 0 0 12px;
  }

  #post-search {
    width: 100%;
    padding: 10px 14px;
    font-size: 1em;
    font-family: 'Factora', Georgia, serif;
    color: rgb(45,44,91);
    border: 2px solid rgb(45,44,91);
    border-radius: 10px;
    outline: none;
  }

  .post-results {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .post-result-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    background: #fff;
    border-radius: 10px;
    text-decoration: none;
  }
  .post-result-item:hover .post-result-link { text-decoration: underline; }
  .post-result-thumb {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    display: block;
  }
  .post-result-link {
    color: rgb(45,44,91);
    font-size: 0.98em;
  }
  .post-results .empty {
    font-size: 0.9em;
    opacity: 0.7;
    margin: 0;
  }

  .idea-table {
    width: 100%;
    border-collapse: collapse;
  }
  .idea-table th {
    text-align: left;
    font-size: 1em;
    font-weight: bold;
    color: rgb(45,44,91);
    padding: 0 10px 6px;
    border-bottom: 1px solid rgb(230,229,240);
  }
  .idea-table th.votes-col {
    text-align: center;
  }
  .idea-table td {
    padding: 7px 10px;
    border-bottom: 1px solid rgb(240,239,247);
    font-size: 1em;
  }
  .idea-table tr:last-child td {
    border-bottom: none;
  }
  .idea-text {
    line-height: 1.35;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 0.75em;
    font-weight: bold;
    color: #fff;
    flex-shrink: 0;
  }
  .rank-badge.gold { background: #C9A227; }
  .rank-badge.silver { background: #A8A8B3; }
  .rank-badge.bronze { background: #B07436; }
  .idea-link {
    color: rgb(45,44,91);
    text-decoration: none;
  }
  .idea-link:hover { text-decoration: underline; }
  .idea-thumb {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    display: block;
    transition: transform 0.15s ease;
  }
  a:hover > .idea-thumb {
    transform: scale(1.1);
  }
  .vote-cell {
    text-align: center;
    white-space: nowrap;
  }
  .vote-trigger {
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .vote-icon {
    display: inline-block;
    width: 18px;
    text-align: center;
  }
  .vote-trigger.disabled {
    cursor: default;
    pointer-events: none;
  }
  .vote-count {
    font-weight: bold;
  }

  .empty, .loading {
    font-size: 0.95em;
    opacity: 0.7;
    margin-top: 8px;
  }

  .to-top {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgb(45, 44, 91);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3em;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(45, 44, 91, 0.35);
    opacity: 0;
    transform: translateY(90px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .to-top.visible {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <a class="thumb-link" id="thumb-link">
      <img class="thumb" src="/images/posts/hitlist.png" alt="Любимые посты — миниатюра, нажми, чтобы увеличить">
    </a>
    <h1 id="title">Любимые посты</h1>
    <a class="home-button" href="https://adorelanguages.com"><span class="arrow">←</span>На главную<br>страницу</a>
  </div>

  <p class="lead">Какой пост тебе больше всего понравился? Найди его через поиск и проголосуй прямо на его странице.</p>

  <div class="search-box">
    <h2>Найти пост</h2>
    <input type="text" id="post-search" maxlength="80" placeholder="Поиск по ключевым словам">
    <div class="post-results" id="post-results"></div>
  </div>

  <div class="idea-list" id="idea-list">
    <p class="loading">Загружаю посты…</p>
  </div>

</div>

<a href="#" class="to-top" id="to-top" aria-label="Наверх">↑</a>

<div class="lightbox-overlay" id="lightbox-overlay">
  <img src="/images/posts/hitlist.png" alt="Любимые посты">
</div>

<script>
  const thumbLink = document.getElementById('thumb-link');
  const lightbox = document.getElementById('lightbox-overlay');
  thumbLink.addEventListener('click', (e) => {
    e.preventDefault();
    lightbox.classList.add('visible');
  });
  lightbox.addEventListener('click', () => {
    lightbox.classList.remove('visible');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') lightbox.classList.remove('visible');
  });

  const POLL_ID = 'hitlist';
  const API_URL = 'https://script.google.com/macros/s/AKfycbwo0yIv4Fa69mDJJKjdn3w-cUJsvP-XCCJnSAeydgvMBuFhVRxS2qo8fmUk3n3hqBNHjA/exec';
  const VOTED_KEY = 'adore_voted_' + POLL_ID;

  function getVoted() {
    try {
      return JSON.parse(localStorage.getItem(VOTED_KEY) || '[]');
    } catch (e) {
      return [];
    }
  }

  function markVoted(id) {
    const voted = getVoted();
    voted.push(id);
    localStorage.setItem(VOTED_KEY, JSON.stringify(voted));
  }

  function unmarkVoted(id) {
    const voted = getVoted().filter(v => v !== id);
    localStorage.setItem(VOTED_KEY, JSON.stringify(voted));
  }

  const RANKS = [
    { cls: 'gold', label: '1' },
    { cls: 'silver', label: '2' },
    { cls: 'bronze', label: '3' }
  ];

  function renderIdeas(ideas) {
    const list = document.getElementById('idea-list');
    list.innerHTML = '';

    if (!ideas.length) {
      list.innerHTML = '<p class="empty">Пока нет одобренных постов – стань первым, кто предложит свой!</p>';
      return;
    }

    const voted = getVoted();

    const table = document.createElement('table');
    table.className = 'idea-table';
    table.innerHTML = `
      <thead>
        <tr><th>Посты</th><th class="votes-col">Голоса</th></tr>
      </thead>
      <tbody></tbody>
    `;
    const tbody = table.querySelector('tbody');

    ideas.forEach((idea, index) => {
      const alreadyVoted = voted.includes(idea.id);
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="idea-text"></td>
        <td class="vote-cell">
          <span class="vote-trigger ${alreadyVoted ? 'disabled' : ''}"><span class="vote-icon">👍</span> <span class="vote-count">${idea.votes}</span></span>
        </td>
      `;
      const textCell = row.querySelector('.idea-text');
      const rank = RANKS[index];
      if (rank) {
        const badge = document.createElement('span');
        badge.className = `rank-badge ${rank.cls}`;
        badge.textContent = rank.label;
        textCell.appendChild(badge);
      }

      const matchedPost = allSitePosts.find(
        p => p.title.trim().toLowerCase() === idea.text.trim().toLowerCase()
      );

      if (matchedPost) {
        const url = `https://adorelanguages.com/site/${matchedPost.slug}/`;
        const link = document.createElement('a');
        link.className = 'idea-link';
        link.href = url;
        link.textContent = idea.text;
        textCell.appendChild(link);

        const thumbLink = document.createElement('a');
        thumbLink.href = url;
        const thumb = document.createElement('img');
        thumb.className = 'idea-thumb';
        thumb.src = `/images/posts/${matchedPost.slug}.png`;
        thumb.alt = '';
        thumbLink.appendChild(thumb);
        textCell.appendChild(thumbLink);
      } else {
        textCell.appendChild(document.createTextNode(idea.text));
      }

      const trigger = row.querySelector('.vote-trigger');
      if (!alreadyVoted) {
        trigger.addEventListener('click', () => vote(idea.id, trigger));
      }

      tbody.appendChild(row);
    });

    list.appendChild(table);
  }

  let pendingRequests = 0;

  function loadIdeas() {
    if (pendingRequests > 0) return; // не перезатирать оптимистичное обновление во время голосования/отправки
    fetch(`${API_URL}?poll=${encodeURIComponent(POLL_ID)}&_=${Date.now()}`, { cache: 'no-store' })
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          renderIdeas(data.ideas);
        } else {
          document.getElementById('idea-list').innerHTML = '<p class="empty">Не удалось загрузить посты.</p>';
        }
      })
      .catch(() => {
        document.getElementById('idea-list').innerHTML = '<p class="empty">Не удалось загрузить посты.</p>';
      });
  }

  function vote(id, trigger) {
    trigger.classList.add('disabled');
    const countEl = trigger.querySelector('.vote-count');
    const originalVotes = parseInt(countEl.textContent, 10) || 0;
    countEl.textContent = originalVotes + 1;
    markVoted(id);

    pendingRequests++;
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'vote', poll: POLL_ID, id: id })
    })
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          countEl.textContent = data.votes;
        } else {
          countEl.textContent = originalVotes;
          trigger.classList.remove('disabled');
          unmarkVoted(id);
        }
      })
      .catch(() => {
        countEl.textContent = originalVotes;
        trigger.classList.remove('disabled');
        unmarkVoted(id);
      })
      .finally(() => { pendingRequests--; });
  }

  let allSitePosts = [];

  function loadSitePosts() {
    fetch('/links/site/posts.json')
      .then(r => r.json())
      .then(posts => { allSitePosts = posts; })
      .catch(() => { allSitePosts = []; });
  }

  function renderPostResults(matches) {
    const results = document.getElementById('post-results');
    results.innerHTML = '';
    if (!matches.length) {
      results.innerHTML = '<p class="empty">Ничего не найдено.</p>';
      return;
    }
    matches.forEach(post => {
      const url = `https://adorelanguages.com/site/${post.slug}/`;
      const item = document.createElement('a');
      item.className = 'post-result-item';
      item.href = url;
      item.innerHTML = `
        <img class="post-result-thumb" src="/images/posts/${post.slug}.png" alt="">
        <span class="post-result-link">${post.title}</span>
      `;
      results.appendChild(item);
    });
  }

  function filterSitePosts() {
    const q = document.getElementById('post-search').value.toLowerCase().trim();
    const results = document.getElementById('post-results');
    if (!q) {
      results.innerHTML = '';
      return;
    }
    const matches = allSitePosts
      .filter(post => post.title.toLowerCase().includes(q) || post.tags.join(' ').toLowerCase().includes(q))
      .sort((a, b) => a.title.localeCompare(b.title, 'ru'));
    renderPostResults(matches);
  }

  document.getElementById('post-search').addEventListener('input', filterSitePosts);
  loadSitePosts();

  loadIdeas();

  // Сразу после захода на страницу (в т.ч. по переходу со звезды на посте) опрашиваем сервер
  // чаще обычного - Apps Script иногда не успевает записать голос за 1-2 секунды, а ждать
  // здесь обычные 15 секунд до следующего опроса слишком долго.
  let fastPollCount = 0;
  const fastPollTimer = setInterval(() => {
    loadIdeas();
    fastPollCount++;
    if (fastPollCount >= 8) clearInterval(fastPollTimer);
  }, 2000);

  setInterval(loadIdeas, 15000);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      loadIdeas();
    }
  });
</script>

<script>
  const toTopBtn = document.getElementById('to-top');
  window.addEventListener('scroll', () => {
    toTopBtn.classList.toggle('visible', window.scrollY > 300);
  });
  function scrollToTop(e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  toTopBtn.addEventListener('click', scrollToTop);
  toTopBtn.addEventListener('touchend', scrollToTop);
</script>

</body>
</html>
