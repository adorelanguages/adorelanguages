<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Голосования – Обожаю Языки</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Голосования читателей блога «Обожаю Языки»: предлагай варианты и голосуй за понравившиеся.">
<link rel="canonical" href="https://adorelanguages.com/golosovania/">
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<style>
  @font-face { font-family: 'Factora'; src: url('/FACTORA-REGULAR.OTF'); font-weight: normal; }
  @font-face { font-family: 'Factora'; src: url('/FACTORA-BOLD.OTF'); font-weight: bold; }

  * { box-sizing: border-box; }

  body {
    font-family: 'Factora', Georgia, serif;
    background: #ffffff;
    color: rgb(45, 44, 91);
    padding: 40px 20px 80px;
    margin: 0;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

  .home-button {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgb(45, 44, 91);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    flex-shrink: 0;
  }
  .home-button svg { display: block; }

  h1 { font-size: 1.8em; margin: 0 0 8px; }

  p.lead {
    font-size: 1.05em;
    line-height: 1.5;
    margin: 0 0 28px;
  }

  .poll-list { display: flex; flex-direction: column; gap: 20px; }

  .poll-row {
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: rgb(45,44,91);
  }

  .poll-thumb {
    width: 72px;
    height: 72px;
    object-fit: cover;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(45,44,91,0.25);
    flex-shrink: 0;
    display: block;
    transition: transform 0.15s ease;
  }
  .poll-row:hover .poll-thumb {
    transform: scale(1.03);
  }

  .poll-title {
    font-size: 1.3em;
    font-weight: bold;
  }

  .empty {
    font-size: 0.95em;
    opacity: 0.7;
  }
</style>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <h1>Голосования</h1>
    <a class="home-button" href="https://adorelanguages.com" aria-label="На главную страницу"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M3 11.5L12 4l9 7.5" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9a1 1 0 0 0 1 1H10a.5.5 0 0 0 .5-.5V15a1.5 1.5 0 0 1 3 0v4.5a.5.5 0 0 0 .5.5h3.5a1 1 0 0 0 1-1v-9" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>

  <p class="lead">Здесь собраны все голосования читателей блога «Обожаю Языки» – предлагай свои варианты и голосуй за понравившиеся.</p>

  <div class="poll-list" id="poll-list">
    <a class="poll-row" href="/golosovania/karta/">
      <img class="poll-thumb" src="/images/icons/serdce-sinee.png" alt="Карта Обожателей Языков – миниатюра">
      <span class="poll-title">Карта Обожателей Языков</span>
    </a>
    <a class="poll-row" href="/golosovania/hitlist/">
      <img class="poll-thumb" src="/images/posts/hitlist.png" alt="Любимые посты – миниатюра">
      <span class="poll-title">Любимые посты</span>
    </a>
    <a class="poll-row" href="/golosovania/idei/">
      <img class="poll-thumb" src="/images/logo.jpg" alt="Обожаю Языки – логотип">
      <span class="poll-title">Идеи для постов</span>
    </a>
    <a class="poll-row" href="/links/site/section/interaktivnyeposty/">
      <img class="poll-thumb" src="/images/icons/pero-ruchka.png" alt="Интерактивные посты – миниатюра">
      <span class="poll-title">Интерактивные посты</span>
    </a>
  </div>

</div>
