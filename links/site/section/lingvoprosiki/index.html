<script>
(function() {
  function trackShare(name, title) {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({
        path: function(p) { return name + '-' + p; },
        title: title,
        event: true
      });
    }
  }

  var shareBtn = document.getElementById('share-btn');
  var sharePanel = document.getElementById('share-panel');
  if (shareBtn && sharePanel) {
    shareBtn.addEventListener('click', function() {
      sharePanel.classList.toggle('open');
      trackShare('share-panel-open', 'Поделиться: открыта панель');
    });
  }

  var canonicalEl = document.querySelector('link[rel="canonical"]');
  var pageUrl = canonicalEl ? canonicalEl.href : window.location.href;
  var pageTitle = document.title.split(' – ')[0];
  var shareText = pageTitle + ' – Обожаю Языки';

  var links = {
    'share-whatsapp': 'https://wa.me/?text=' + encodeURIComponent(shareText + ' ' + pageUrl),
    'share-messenger': 'fb-messenger://share?link=' + encodeURIComponent(pageUrl),
    'share-x': 'https://twitter.com/intent/tweet?url=' + encodeURIComponent(pageUrl) + '&text=' + encodeURIComponent(shareText),
    'share-facebook': 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(pageUrl),
    'share-telegram': 'https://t.me/share/url?url=' + encodeURIComponent(pageUrl) + '&text=' + encodeURIComponent(shareText),
    'share-viber': 'viber://forward?text=' + encodeURIComponent(shareText + ' ' + pageUrl),
    'share-email': 'mailto:?subject=' + encodeURIComponent(shareText) + '&body=' + encodeURIComponent(pageUrl)
  };
  Object.keys(links).forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.href = links[id];
  });

  var plainShareTitles = {
    'share-whatsapp': 'Поделиться: WhatsApp',
    'share-messenger': 'Поделиться: Messenger',
    'share-x': 'Поделиться: X',
    'share-telegram': 'Поделиться: Telegram',
    'share-viber': 'Поделиться: Viber',
    'share-email': 'Поделиться: Email'
  };
  Object.keys(plainShareTitles).forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', function() { trackShare(id, plainShareTitles[id]); });
  });

  function copyLink() {
    var done = function() {
      var label = document.getElementById('share-copy-label');
      if (label) {
        var old = label.textContent;
        label.textContent = 'Скопировано!';
        setTimeout(function() { label.textContent = old; }, 1500);
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(pageUrl).then(done).catch(done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = pageUrl;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  }

  var copyBtn = document.getElementById('share-copy-btn');
  if (copyBtn) copyBtn.addEventListener('click', function() {
    trackShare('share-copy-link', 'Поделиться: скопировать ссылку');
    copyLink();
  });

  var toastEl = document.getElementById('share-toast');
  var toastTimer = null;
  function showToast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 3500);
  }

  var isMobile = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);

  var igBtn = document.getElementById('share-instagram');
  if (igBtn) {
    igBtn.addEventListener('click', function(e) {
      e.preventDefault();
      trackShare('share-instagram', 'Поделиться: Instagram');
      copyLink();
      showToast('Ссылка скопирована! Вставьте её в Instagram.');
    });
  }

  var fbBtn = document.getElementById('share-facebook');
  if (fbBtn) {
    if (isMobile) {
      fbBtn.addEventListener('click', function(e) {
        e.preventDefault();
        trackShare('share-facebook', 'Поделиться: Facebook');
        copyLink();
        showToast('Ссылка скопирована! Откройте Facebook и вставьте её в новый пост.');
      });
    } else {
      fbBtn.addEventListener('click', function() {
        trackShare('share-facebook', 'Поделиться: Facebook');
        copyLink();
      });
    }
  }
})();
</script>

<script>
  const COLOR_ORDER = ['pink', 'lilac', 'blue', 'green'];
  const grid = document.getElementById('post-grid');
  const cards = Array.from(grid.children);
  const emptyMsg = document.getElementById('empty-msg');
  if (emptyMsg) emptyMsg.style.display = cards.length === 0 ? 'block' : 'none';

  const buckets = { pink: [], lilac: [], blue: [], green: [] };
  cards.forEach(c => buckets[c.dataset.bg].push(c));
  Object.values(buckets).forEach(arr => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  });
  const pointers = { pink: 0, lilac: 0, blue: 0, green: 0 };
  let colorIdx = 0;
  let remaining = cards.length;
  while (remaining > 0) {
    let placed = false;
    for (let attempt = 0; attempt < 4; attempt++) {
      const color = COLOR_ORDER[colorIdx % 4];
      colorIdx++;
      if (pointers[color] < buckets[color].length) {
        grid.appendChild(buckets[color][pointers[color]++]);
        remaining--;
        placed = true;
        break;
      }
    }
    if (!placed) break;
  }
</script>
