<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Игра слов – Обожаю Языки</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Игра слов, каламбуры и языковые шутки на русском и других языках.">

<style>
  @font-face { font-family: 'Factora'; src: url('/FACTORA-REGULAR.OTF'); font-weight: normal; }
  @font-face { font-family: 'Factora'; src: url('/FACTORA-BOLD.OTF'); font-weight: bold; }

  * { box-sizing: border-box; }

  body {
    font-family: 'Factora', Georgia, serif;
    background: #ffffff;
    color: rgb(45, 44, 91);
    padding: 40px 20px;
    margin: 0;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  .topbar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }

  .home-button {
    font-family: 'Factora', Georgia, serif;
    font-size: 1em;
    color: #fff;
    background: rgb(45, 44, 91);
    padding: 14px 10px;
    border-radius: 18px;
    text-decoration: none;
    display: inline-block;
    width: 130px;
    box-sizing: border-box;
    text-align: center;
    line-height: 1.3;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .home-button .arrow { margin-right: 4px; }

  .title-block { min-width: 0; margin: 0 0 8px; }

  h1 {
    font-size: 1.8em;
    font-family: 'Factora', Georgia, serif;
    margin: 0;
  }

  .subtitle {
    font-family: 'Factora', Georgia, serif;
    font-weight: normal;
    font-style: normal;
    color: rgb(45, 44, 91);
    white-space: nowrap;
    margin: 2px 0 0;
  }

  .toggle {
    margin: 20px 0 24px;
    font-size: 0.95em;
  }
  .toggle a {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid rgb(45, 44, 91);
    margin-right: 10px;
    text-decoration: none;
    color: rgb(45, 44, 91);
    display: inline-block;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
    margin-top: 8px;
  }

  .card {
    text-decoration: none;
    color: rgb(45, 44, 91);
    display: block;
  }

  .card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    background: #f2f1f8;
    box-shadow: 0 2px 6px rgba(45, 44, 91, 0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover img {
    transform: scale(1.03);
    box-shadow: 0 4px 12px rgba(45, 44, 91, 0.25);
  }

  .empty {
    font-size: 0.95em;
    opacity: 0.7;
    margin-top: 20px;
  }

  .to-top {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgb(45, 44, 91);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3em;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(45, 44, 91, 0.35);
    opacity: 0;
    transform: translateY(90px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .to-top.visible {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="title-block">
      <h1 id="title">Игра слов</h1>
      <div class="subtitle" id="subtitle">(автор – не я)</div>
    </div>
    <a class="home-button" href="https://adorelanguages.com"><span class="arrow">←</span>На главную<br>страницу</a>
  </div>

  <div class="toggle">
    <a href="/links/site/">← Все разделы</a>
    <a href="/links/site/all/">Все посты</a>
  </div>

  <div class="grid" id="post-grid"></div>
  <p class="empty" id="empty-msg" style="display:none;">Пока здесь нет постов – скоро появятся!</p>

</div>

<a href="#" class="to-top" id="to-top" aria-label="Наверх">↑</a>

<script>
  // Подзаголовок "(в основном не мои)" не должен быть шире заголовка, включая
  // скобки - размер шрифта подгоняется под фактическую отрисованную ширину h1
  // (а не подбирается на глаз фиксированным числом), чтобы не разъехаться при
  // другом рендеринге шрифта/зуме. Пересчитывается и после загрузки шрифта
  // Factora (иначе на fallback-шрифте ширины будут другими), и при resize.
  //
  // НАСТОЯЩАЯ причина, из-за которой подзаголовок раз за разом оказывался
  // шире заголовка на телефонах: заголовок "Языковые шутки" на узких экранах
  // переносится в 2 строки (заголовок - блочный элемент, а .title-block
  // сжимается flex-контейнером из-за фиксированной ширины кнопки "На главную
  // страницу"). У БЛОЧНОГО элемента getBoundingClientRect()/getClientRects()
  // всегда возвращают ширину ЕГО СОБСТВЕННОГО БОКСА (т.е. ширину, которую ему
  // выделил flex-родитель), а НЕ фактическую ширину видимых глифов самой
  // длинной строки текста внутри - а слово, на котором произошёл перенос,
  // почти никогда не доходит ровно до правого края бокса. В результате
  // подзаголовок подгонялся под ширину пустого бокса, а не под реальную
  // видимую ширину слова "Языковые" - и оказывался заметно шире того, что
  // человек реально видит глазами. По той же причине scrollWidth здесь не
  // спасает: если после уменьшения шрифта текст подзаголовка становится УЖЕ
  // бокса, scrollWidth возвращает ширину бокса (max(clientWidth, contentWidth)),
  // а не суженного текста.
  //
  // Правильное и надёжное решение - Range.getClientRects(): в отличие от
  // блочного элемента, диапазон (Range), охватывающий текстовые узлы,
  // возвращает один DOMRect на каждую визуально отрисованную строку с её
  // РЕАЛЬНОЙ шириной глифов, независимо от ширины охватывающего блочного
  // бокса. Используется и для заголовка (может быть в 1 или 2 строки), и
  // для подзаголовка (всегда в 1 строку благодаря white-space: nowrap).
  function trueTextWidth(el) {
    const range = document.createRange();
    range.selectNodeContents(el);
    const rects = range.getClientRects();
    if (!rects.length) return el.getBoundingClientRect().width;
    return Math.max.apply(null, Array.from(rects).map(function (r) { return r.width; }));
  }
  function fitSubtitleWidth() {
    const h1 = document.getElementById('title');
    const sub = document.getElementById('subtitle');
    if (!h1 || !sub) return;
    const titleFontSize = parseFloat(getComputedStyle(h1).fontSize);
    sub.style.fontSize = titleFontSize + 'px';
    const h1Width = trueTextWidth(h1);
    const subWidth = trueTextWidth(sub);
    if (subWidth > h1Width) {
      sub.style.fontSize = (titleFontSize * (h1Width / subWidth)) + 'px';
    }
  }
  // Один запуск в правильный момент (после document.fonts.ready) не всегда
  // надёжен на реальных телефонах: тулбар браузера может схлопнуться/
  // раскрыться уже ПОСЛЕ первой отрисовки и изменить реальную ширину
  // .title-block, а на десктопе окно можно просто растянуть/сжать - в обоих
  // случаях нужен пересчёт, а полагаться на одно единственное срабатывание
  // resize ненадёжно. Поэтому вместо (или в дополнение к) ручных обработчиков
  // используется ResizeObserver прямо на заголовке - он сам уведомляет о
  // любом изменении фактической ширины h1, от какой бы причины оно ни было
  // (загрузка шрифта, resize окна, изменение вьюпорта на мобильном,
  // поворот экрана), и пересчитывает подзаголовок каждый раз заново.
  fitSubtitleWidth();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitSubtitleWidth);
  }
  window.addEventListener('resize', fitSubtitleWidth);
  window.addEventListener('orientationchange', fitSubtitleWidth);
  window.addEventListener('load', fitSubtitleWidth);
  if (window.ResizeObserver) {
    const titleEl = document.getElementById('title');
    // Наблюдаем именно за h1, а не за subtitle - иначе собственные изменения
    // размера подзаголовка запускали бы наблюдатель по кругу.
    new ResizeObserver(() => fitSubtitleWidth()).observe(titleEl);
  }
  // requestAnimationFrame дважды подряд - надёжный способ дождаться, пока
  // браузер реально завершит layout/paint (в отличие от document.fonts.ready,
  // который гарантирует только загрузку файла шрифта, но не факт, что layout
  // уже пересчитан с его учётом).
  requestAnimationFrame(() => requestAnimationFrame(fitSubtitleWidth));
  // Подстраховка: ни один из перечисленных выше обработчиков не даёт 100%
  // гарантии сработать на любом реальном телефоне (ResizeObserver ведёт себя
  // непредсказуемо в некоторых браузерах, сворачивание адресной строки не
  // всегда бросает resize и т.п.) - поэтому в первые секунды после загрузки
  // страницы просто пересчитываем несколько раз подряд с небольшим
  // интервалом, а затем останавливаемся, чтобы не тратить ресурсы впустую.
  let fitAttempts = 0;
  const fitInterval = setInterval(() => {
    fitSubtitleWidth();
    fitAttempts++;
    if (fitAttempts >= 20) clearInterval(fitInterval);
  }, 150);

  const toTopBtn = document.getElementById('to-top');
  window.addEventListener('scroll', () => {
    toTopBtn.classList.toggle('visible', window.scrollY > 300);
  });
  function scrollToTop(e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  toTopBtn.addEventListener('click', scrollToTop);
  toTopBtn.addEventListener('touchend', scrollToTop);
</script>

<script>
  const COLOR_ORDER = ['pink', 'lilac', 'blue', 'green'];

  function colorRespectingShuffle(posts) {
    const buckets = { pink: [], lilac: [], blue: [], green: [] };
    posts.forEach(p => buckets[p.bg].push(p));
    Object.values(buckets).forEach(arr => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    });
    const pointers = { pink: 0, lilac: 0, blue: 0, green: 0 };
    const result = [];
    let colorIdx = 0;
    let remaining = posts.length;
    while (remaining > 0) {
      let placed = false;
      for (let attempt = 0; attempt < 4; attempt++) {
        const color = COLOR_ORDER[colorIdx % 4];
        colorIdx++;
        if (pointers[color] < buckets[color].length) {
          result.push(buckets[color][pointers[color]++]);
          remaining--;
          placed = true;
          break;
        }
      }
      if (!placed) break;
    }
    return result;
  }

  Promise.all([
    fetch('/links/site/sections.json').then(r => r.json()),
    fetch('/links/site/posts.json').then(r => r.json())
  ]).then(([sections, allPosts]) => {
    const section = sections['igraslov'];
    const slugs = section.slugs || [];
    const posts = allPosts.filter(p => slugs.includes(p.slug));

    document.getElementById('title').textContent = `Игра слов`;

    if (posts.length === 0) {
      document.getElementById('empty-msg').style.display = 'block';
      return;
    }

    const ordered = colorRespectingShuffle(posts);
    const grid = document.getElementById('post-grid');
    ordered.forEach(p => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = `/site/${p.slug}/`;
      card.innerHTML = `<img src="/images/posts/${p.slug}.png" alt="${p.title}" loading="lazy">`;
      grid.appendChild(card);
    });
  });
</script>
