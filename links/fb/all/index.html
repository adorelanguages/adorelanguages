<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обзор постов в фейсбуке – Обожаю Языки</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Алфавитный обзор всех постов блога «Обожаю Языки» в Facebook: этимология слов, идиомы, языковые курьёзы и факты о языках мира.">
<link rel="canonical" href="https://adorelanguages.com/links/fb/all/">

<style>
  @font-face { font-family: 'Factora'; src: url('/FACTORA-REGULAR.OTF'); font-weight: normal; }
  @font-face { font-family: 'Factora'; src: url('/FACTORA-BOLD.OTF'); font-weight: bold; }

  body {
    font-family: 'Factora', Georgia, serif;
    background: #ffffff;
    color: rgb(45, 44, 91);
    margin: 0;
    padding: 40px 20px;
  }

  .wrap { max-width: 640px; margin: 0 auto; }
  a { color: rgb(45,44,91); text-decoration: none; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  /* Заголовок – как на /links/fb/ */
  h1 {
    font-size: 1.8em;
    display: inline;
    margin: 0 0 8px;
  }

  .home-button {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgb(45, 44, 91);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    flex-shrink: 0;
  }
  .home-button svg { display: block; }

  .toggle { margin-bottom: 20px; }
  .toggle a {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid rgb(45,44,91);
    margin-right: 10px;
    display: inline-block;
  }

  ul { padding-left: 20px; }

  .letter-group { margin-top: 28px; }
  .letter-group:first-of-type { margin-top: 12px; }

  .letter-badge {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Factora', Georgia, serif;
    font-weight: bold;
    font-size: 1.05em;
    margin-bottom: 8px;
    border: 1px solid rgb(45,44,91); /* обводка */
  }

  .letter-group ul { margin: 0; padding-left: 20px; }
  .letter-group li { margin-bottom: 4px; }

  .to-top {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgb(45, 44, 91);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3em;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(45, 44, 91, 0.35);
    opacity: 0;
    transform: translateY(90px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .to-top.visible {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <h1>Обзор постов в фейсбуке</h1>
    <a class="home-button" href="https://adorelanguages.com" aria-label="На главную страницу"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M3 11.5L12 4l9 7.5" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9a1 1 0 0 0 1 1H10a.5.5 0 0 0 .5-.5V15a1.5 1.5 0 0 1 3 0v4.5a.5.5 0 0 0 .5.5h3.5a1 1 0 0 0 1-1v-9" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>

  <div class="toggle">
    <a href="/links/fb/">Поиск</a>
    <a href="/links/fb/all/" style="background: rgb(45,44,91); color: #fff;">Обзор постов</a>
  </div>

  <div id="post-list"></div>

</div>

<a href="#" class="to-top" id="to-top" aria-label="Наверх">↑</a>

<script>
  const BADGE_COLORS = [
    { bg: '#F4DBCE', text: 'rgb(45,44,91)' },
    { bg: '#E9CEF2', text: 'rgb(45,44,91)' },
    { bg: '#461359', text: 'rgb(129,239,135)' },
    { bg: '#F0F7CD', text: 'rgb(45,44,91)' }
  ];

  fetch('/links/fb/posts.json')
    .then(r => r.json())
    .then(posts => {
      posts.sort((a, b) => a.title.localeCompare(b.title, 'ru'));

      /* ⭐ Счётчик – как на /links/fb/ */
      
      const groups = {};
      posts.forEach(p => {
        const letter = p.title.trim()[0].toUpperCase();
        if (!groups[letter]) groups[letter] = [];
        groups[letter].push(p);
      });

      const container = document.getElementById('post-list');

      const presentLetters = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'ru'));

      presentLetters.forEach((letter, i) => {
        const color = BADGE_COLORS[i % 4];

        const section = document.createElement('div');
        section.className = 'letter-group';

        const badge = document.createElement('div');
        badge.className = 'letter-badge';
        badge.textContent = letter;
        badge.style.background = color.bg;
        badge.style.color = color.text;

        section.appendChild(badge);

        const ul = document.createElement('ul');
        groups[letter].forEach(p => {
          const li = document.createElement('li');
          li.innerHTML = `<a href="/fb/${p.slug}/">${p.title}</a>`;
          ul.appendChild(li);
        });

        section.appendChild(ul);
        container.appendChild(section);
      });
    });

  const toTopBtn = document.getElementById('to-top');
  window.addEventListener('scroll', () => {
    toTopBtn.classList.toggle('visible', window.scrollY > 300);
  });
  function scrollToTop(e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  toTopBtn.addEventListener('click', scrollToTop);
  toTopBtn.addEventListener('touchend', scrollToTop);
</script>

</body>
</html>
