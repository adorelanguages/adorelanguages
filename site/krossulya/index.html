<script>
(function() {
  var API_URL = 'https://script.google.com/macros/s/AKfycbwo0yIv4Fa69mDJJKjdn3w-cUJsvP-XCCJnSAeydgvMBuFhVRxS2qo8fmUk3n3hqBNHjA/exec';
  var POST_TITLE = "Кроссуля";
  var VOTED_KEY = 'adore_hitlist_voted_posts';
  var btn = document.getElementById('hitlist-btn');
  var label = btn.querySelector('.label');

  function getVoted() {
    try { return JSON.parse(localStorage.getItem(VOTED_KEY) || '[]'); } catch (e) { return []; }
  }
  function markVoted(title) {
    var voted = getVoted();
    if (voted.indexOf(title) === -1) {
      voted.push(title);
      localStorage.setItem(VOTED_KEY, JSON.stringify(voted));
    }
  }

  if (getVoted().indexOf(POST_TITLE) !== -1) {
    btn.classList.add('voted');
    label.textContent = 'Уже в хит-листе!';
  }

  btn.addEventListener('click', function(e) {
    e.preventDefault();
    if (btn.classList.contains('voted')) return;
    // Мобильные браузеры часто блокируют переход, если он происходит уже
    // после того, как асинхронный fetch успел завершиться (жест пользователя
    // к этому моменту как бы "устарел"). Поэтому переходим сразу же, синхронно
    // по клику, а сам запрос отправляем с keepalive: true — он гарантированно
    // долетит до сервера, даже если страница в этот момент уже начала уходить.
    btn.classList.add('voted');
    markVoted(POST_TITLE);
    try {
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        keepalive: true,
        body: JSON.stringify({ action: 'vote_post', poll: 'hitlist', text: POST_TITLE })
      }).catch(function() {});
    } catch (err) {}
    window.location.href = 'https://adorelanguages.com/golosovania/hitlist/';
  });
})();
</script>
