<script>
(function() {
  // .home-btn is always positioned by this script (never by CSS flex).
  // Of the other two elements, whichever is the "anchor" for the
  // current breakpoint is put in normal flow and alone defines the top
  // row's natural height, matching the 8px gap used before a stacked
  // button on every other post page; the "secondary" element either
  // sits centered exactly midway between the anchor and the home button
  // (wide screens, when there's room) or stacks in its own row below
  // (narrow screens, and wide screens too if there isn't room). At
  // every width home sits flush against the content column's own right
  // edge (.wrap) - the same zero-gap treatment the anchor gets against
  // the left edge, mirrored - rather than centered in whatever space
  // happens to be left.
  //
  // On wide screens the anchor is "Повысить рейтинг" (the classic
  // layout); on narrow screens the anchor is "Поделиться" instead, so
  // it sits in the top row next to "Дом" (both filled navy) while
  // "Повысить рейтинг" (unfilled on mobile) drops to its own row below.
  var wrap = document.getElementById('topRowWrap');
  var pill = document.getElementById('hitlist-btn');
  var home = document.getElementById('homeBtn');
  var share = document.getElementById('share-btn');
  var wrapEl = document.querySelector('.wrap');
  var mq = window.matchMedia('(min-width: 600px)');
  var HOME_SIZE = 52;
  // Minimum breathing room to leave on each side of the secondary
  // element when centering it between the anchor and the home button.
  // If the gap is too narrow for that (can happen right around the
  // breakpoint, where the three buttons are close to not fitting on one
  // line at all), layout() falls back to the stacked arrangement
  // instead of letting the buttons overlap.
  var MIN_SHARE_GAP = 10;

  function setAnchor(el) {
    el.style.position = 'static';
    el.style.left = '';
    el.style.top = '';
    el.style.display = 'inline-flex';
    el.style.width = 'auto';
    el.style.marginTop = '0';
  }

  // The secondary element is always position:absolute - whether it's
  // centered between anchor and home, or dropped to its own row below -
  // so its vertical placement can always be computed explicitly against
  // home's actual bottom edge. That matters now that "Дом" is taller
  // than either button's own row: a plain CSS margin-top under the
  // anchor's flow position would clear the anchor's bottom but not
  // home's lower overhang, exactly the overlap this replaces.
  function freeSecondary(el) {
    el.style.position = 'absolute';
    el.style.marginTop = '0';
    el.style.display = 'inline-flex';
    el.style.width = 'auto';
  }

  function layout() {
    var desktop = mq.matches;
    var anchor = desktop ? pill : share;
    var secondary = desktop ? share : pill;

    setAnchor(anchor);
    freeSecondary(secondary);

    var wrapRect = wrap.getBoundingClientRect();
    var anchorRect = anchor.getBoundingClientRect();
    var anchorLeftRel = anchorRect.left - wrapRect.left;
    var anchorCenterY = anchorRect.top - wrapRect.top + anchorRect.height / 2;

    var edgeRel = wrapEl.getBoundingClientRect().right - wrapRect.left;
    var homeLeftRel = edgeRel - HOME_SIZE;
    var homeTopRel = anchorCenterY - HOME_SIZE / 2;

    home.style.left = homeLeftRel + 'px';
    home.style.top = homeTopRel + 'px';

    var anchorBottomRel = anchorRect.top - wrapRect.top + anchorRect.height;
    var homeBottomRel = homeTopRel + HOME_SIZE;
    var neededHeight = Math.max(anchorRect.height, homeBottomRel);
    var inline = false;

    if (desktop) {
      var homeLeftAbs = wrapRect.left + homeLeftRel;
      var gap = homeLeftAbs - anchorRect.right;
      if (gap >= secondary.offsetWidth + MIN_SHARE_GAP * 2) {
        inline = true;
        var midX = (anchorRect.right + homeLeftAbs) / 2;
        secondary.style.left = (midX - wrapRect.left - secondary.offsetWidth / 2) + 'px';
        secondary.style.top = (anchorCenterY - secondary.offsetHeight / 2) + 'px';
        neededHeight = Math.max(neededHeight, anchorCenterY + secondary.offsetHeight / 2);
      }
    }

    if (!inline) {
      var stackTopRel = Math.max(anchorBottomRel, homeBottomRel) + 8;
      secondary.style.left = anchorLeftRel + 'px';
      secondary.style.top = stackTopRel + 'px';
      neededHeight = Math.max(neededHeight, stackTopRel + secondary.offsetHeight);
    }

    wrap.style.minHeight = neededHeight + 'px';
  }

  layout();
  window.addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(layout);
  }
})();
</script>
<script>
(function() {
  var API_URL = 'https://script.google.com/macros/s/AKfycbwo0yIv4Fa69mDJJKjdn3w-cUJsvP-XCCJnSAeydgvMBuFhVRxS2qo8fmUk3n3hqBNHjA/exec';
  var POST_TITLE = "(Не)согласие";
  var VOTED_KEY = 'adore_hitlist_voted_posts';
  var btn = document.getElementById('hitlist-btn');
  var label = btn.querySelector('.label');

  function getVoted() {
    try { return JSON.parse(localStorage.getItem(VOTED_KEY) || '[]'); } catch (e) { return []; }
  }
  function markVoted(title) {
    var voted = getVoted();
    if (voted.indexOf(title) === -1) {
      voted.push(title);
      localStorage.setItem(VOTED_KEY, JSON.stringify(voted));
    }
  }

  if (getVoted().indexOf(POST_TITLE) !== -1) {
    btn.classList.add('voted');
    label.textContent = 'Уже в любимых постах!';
  }

  btn.addEventListener('click', function(e) {
    e.preventDefault();
    if (btn.classList.contains('voted')) return;
    // Мобильные браузеры часто блокируют переход, если он происходит уже
    // после того, как асинхронный fetch успел завершиться (жест пользователя
    // к этому моменту как бы "устарел"). Поэтому переходим сразу же, синхронно
    // по клику, а сам запрос отправляем с keepalive: true – он гарантированно
    // долетит до сервера, даже если страница в этот момент уже начала уходить.
    btn.classList.add('voted');
    markVoted(POST_TITLE);
    try {
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        keepalive: true,
        body: JSON.stringify({ action: 'vote_post', poll: 'hitlist', text: POST_TITLE })
      }).catch(function() {});
    } catch (err) {}
    window.location.href = 'https://adorelanguages.com/golosovania/hitlist/';
  });
})();
</script>

  var shareBtn = document.getElementById('share-btn');
  var sharePanel = document.getElementById('share-panel');
  if (shareBtn && sharePanel) {
    shareBtn.addEventListener('click', function() {
      sharePanel.classList.toggle('open');
    });
  }

  var canonicalEl = document.querySelector('link[rel="canonical"]');
  var pageUrl = canonicalEl ? canonicalEl.href : window.location.href;
  var pageTitle = document.title.split(' – ')[0];
  try {
    var ld = document.querySelector('script[type="application/ld+json"]');
    if (ld) {
      var data = JSON.parse(ld.textContent);
      if (data && data.headline) pageTitle = data.headline;
    }
  } catch (e) {}
  var shareText = pageTitle + ' – Обожаю Языки';

  var links = {
    'share-whatsapp': 'https://wa.me/?text=' + encodeURIComponent(shareText + ' ' + pageUrl),
    'share-messenger': 'fb-messenger://share?link=' + encodeURIComponent(pageUrl),
    'share-x': 'https://twitter.com/intent/tweet?url=' + encodeURIComponent(pageUrl) + '&text=' + encodeURIComponent(shareText),
    'share-facebook': 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(pageUrl),
    'share-telegram': 'https://t.me/share/url?url=' + encodeURIComponent(pageUrl) + '&text=' + encodeURIComponent(shareText),
    'share-viber': 'viber://forward?text=' + encodeURIComponent(shareText + ' ' + pageUrl),
    'share-email': 'mailto:?subject=' + encodeURIComponent(shareText) + '&body=' + encodeURIComponent(pageUrl)
  };
  Object.keys(links).forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.href = links[id];
  });

  function copyLink() {
    var done = function() {
      var label = document.getElementById('share-copy-label');
      if (label) {
        var old = label.textContent;
        label.textContent = 'Скопировано!';
        setTimeout(function() { label.textContent = old; }, 1500);
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(pageUrl).then(done).catch(done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = pageUrl;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  }

  var copyBtn = document.getElementById('share-copy-btn');
  if (copyBtn) copyBtn.addEventListener('click', copyLink);

  var toastEl = document.getElementById('share-toast');
  var toastTimer = null;
  function showToast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 3500);
  }

  var isMobile = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);

  var igBtn = document.getElementById('share-instagram');
  if (igBtn) {
    igBtn.addEventListener('click', function(e) {
      e.preventDefault();
      copyLink();
      showToast('Ссылка скопирована! Вставьте её в Instagram.');
    });
  }

  // На мобильных устройствах приложение Facebook часто перехватывает ссылку
  // sharer.php через Universal Links / App Links и открывает само приложение,
  // но не подхватывает параметр u= для создания поста - это известное
  // ограничение на стороне самого Facebook (воспроизводится стабильно), а не
  // баг сайта. Поэтому на мобильном переход на facebook.com вообще не
  // выполняется - вместо этого ссылка копируется в буфер и показывается явное
  // уведомление с инструкцией (просто "тихого" копирования недостаточно,
  // потому что человек не успевает его заметить перед переходом в другое
  // приложение). На компьютере sharer.php открывает нормальный попап
  // "Поделиться" и работает штатно - там поведение не меняем.
  var fbBtn = document.getElementById('share-facebook');
  if (fbBtn) {
    if (isMobile) {
      fbBtn.addEventListener('click', function(e) {
        e.preventDefault();
        copyLink();
        showToast('Ссылка скопирована! Откройте Facebook и вставьте её в новый пост.');
      });
    } else {
      fbBtn.addEventListener('click', function() {
        copyLink();
      });
    }
  }
})();
</script>
