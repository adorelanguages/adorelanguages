<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тэги – Обожаю Языки</title>
  <style>
    @font-face { font-family: 'Factora'; src: url('../FACTORA-REGULAR.OTF'); font-weight: normal; }
    @font-face { font-family: 'Factora'; src: url('../FACTORA-BOLD.OTF'); font-weight: bold; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Factora', Georgia, serif; background: #ffffff; color: rgb(45, 44, 91); padding: 40px 20px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .home-button {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgb(45, 44, 91);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
    }
    .home-button svg { display: block; }
    h1 { font-size: 1.8em; margin-bottom: 8px; }
    h2 { font-size: 1.2em; margin: 32px 0 12px; }
    .switch { margin-bottom: 24px; font-size: 0.95em; }
    .switch a { color: rgb(45, 44, 91); }
    .panels { display: flex; gap: 40px; flex-wrap: wrap; }
    .panel { flex: 1 1 300px; }
    .tagfreq { max-width: 400px; display: flex; flex-direction: column; gap: 6px; }
    .tagrow {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 0.9em;
      text-decoration: none;
      color: inherit;
    }
    .tagrow:hover {
      background: rgb(244,244,255);
      border-color: rgb(45, 44, 91);
    }
    .tagrow .name::before { content: "#"; color: #888; }
    .tagrow .count {
      background: rgb(45, 44, 91); color: #fff; font-size: 0.8em;
      padding: 1px 8px; border-radius: 10px; min-width: 20px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Тэги</h1>
    <a class="home-button" href="https://adorelanguages.com" aria-label="На главную страницу"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M3 11.5L12 4l9 7.5" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9a1 1 0 0 0 1 1H10a.5.5 0 0 0 .5-.5V15a1.5 1.5 0 0 1 3 0v4.5a.5.5 0 0 0 .5.5h3.5a1 1 0 0 0 1-1v-9" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>

  <div class="panels">
    <div class="panel">
      <p class="switch">→ <a href="/links/fb">Посмотреть посты в ФБ</a></p>
      <h2>Facebook</h2>
      <div class="tagfreq" id="tagfreq-fb"></div>
    </div>
    <div class="panel">
      <p class="switch">→ <a href="/links/site">Посмотреть посты на сайте</a></p>
      <h2>Сайт</h2>
      <div class="tagfreq" id="tagfreq-site"></div>
    </div>
  </div>

  <script>
    function renderCounts(panelId, tagLists, baseUrl) {
      const counts = {};
      tagLists.forEach(tags => {
        tags.forEach(tag => {
          const t = tag.toLowerCase();
          counts[t] = (counts[t] || 0) + 1;
        });
      });

      const sorted = Object.entries(counts).sort((a, b) => {
        if (b[1] !== a[1]) return b[1] - a[1];
        return a[0].localeCompare(b[0], 'ru');
      });

      const panel = document.getElementById(panelId);
      panel.innerHTML = '';
      sorted.forEach(([tag, count]) => {
        const row = document.createElement('a');
        row.className = 'tagrow';
        row.href = `${baseUrl}?tag=${encodeURIComponent(tag)}`;
        row.innerHTML = `<span class="name">${tag}</span><span class="count">${count}</span>`;
        panel.appendChild(row);
      });
    }

    async function loadFacebookTags() {
      const response = await fetch('../links/fb/posts.json');
      const posts = await response.json();
      renderCounts('tagfreq-fb', posts.map(post => post.tags), '/links/fb/');
    }

    async function loadSiteTags() {
      const response = await fetch('../links/site/posts.json');
      const posts = await response.json();
      renderCounts('tagfreq-site', posts.map(post => post.tags), '/links/site/');
    }

    loadFacebookTags();
    loadSiteTags();
  </script>

</body>
</html>
